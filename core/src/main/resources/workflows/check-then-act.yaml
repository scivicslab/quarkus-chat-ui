name: check-then-act
description: |
  Template for a conditional, self-re-enqueuing workflow. It asks Claude one question whose answer
  must start with YES or NO, stores the answer, and acts only on YES. On NO the workflow puts itself
  back at the end of the prompt queue (after a delay) so the check is repeated when its turn comes.
    - harness.check:  one turn; answers YES or NO (the message). It never fails on NO: the YAML
                      stores the answer with this.putJson and decides with this.onlyIf.
    - harness.send:   one instruction turn (the action to take when the condition holds).
    - queue.requeue:  re-enqueue this same workflow (same YAML and input); the step's delay
                      (milliseconds) spaces the retries.
    - queue.enqueue:  enqueue a plain prompt instead of re-running the whole workflow.
  Input: {"condition": "<question answered YES/NO>", "action": "<instruction sent on YES>"}.
  Input fields are in the interpreter's JSON state: read one with "jexl: state.getString('name')".
  Shape: 0 -> check -> (YES) act -> end / (NO) requeue -> end
params:
  condition:
    label: "Condition (a question Claude answers YES or NO)"
    description: "e.g. Does ~/works/foo/target/foo.jar exist and is it newer than the sources?"
    type: textarea
    required: true
  action:
    label: "Action (sent to Claude when the condition holds)"
    description: "e.g. Deploy the jar to ~/works and report the result."
    type: textarea
    required: true
steps:
  - states: ["0", "check"]
    label: start
    note: "Parse the run input and open the I/O-log session."
    actions:
      - actor: harness
        method: start

  - states: ["check", "act"]
    label: check
    note: |
      One YES/NO turn. The answer is stored as check.answer; only YES takes this transition.
      On NO the state stays "check" and the next transition (requeue) is taken.
    actions:
      - actor: harness
        method: check
        arguments: "jexl: state.getString('condition')"
      - actor: this
        method: putJson
        arguments: {path: check.answer, value: "jexl: result"}
      - actor: this
        method: onlyIf
        arguments: "jexl: state.getString('check.answer') == 'YES'"

  - states: ["check", "end"]
    label: requeue
    note: "The answer was NO: wait, then put this workflow back at the end of the queue."
    delay: 60000
    actions:
      - actor: queue
        method: requeue

  - states: ["act", "end"]
    label: act
    note: "The answer was YES: send the action as one turn."
    actions:
      - actor: harness
        method: send
        arguments: "jexl: state.getString('action')"

  - states: ["!end", "end"]
    note: "Safety net: any unexpected state ends the workflow."
    actions:
      - actor: this
        method: print
        arguments: "check-then-act workflow ended unexpectedly"
